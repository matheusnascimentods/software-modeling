services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      # Executados em ordem alfabética na primeira subida do banco
      - ./ddl.sql:/docker-entrypoint-initdb.d/1-ddl.sql:ro
      - ./dml.sql:/docker-entrypoint-initdb.d/2-dml.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  client:
    image: dbgate/dbgate:latest
    environment:
      CONNECTIONS: madeira
      LABEL_madeira: MadeiraVerde
      ENGINE_madeira: mariadb@dbgate-plugin-mysql
      SERVER_madeira: db
      PORT_madeira: "3306"
      USER_madeira: root
      PASSWORD_madeira: root
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy

  url:
    image: busybox
    command: echo "Banco MadeiraVerde pronto. Cliente MariaDB em http://localhost:8080"
    depends_on:
      - client
